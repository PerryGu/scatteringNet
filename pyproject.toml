[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scatteringnet"
version = "0.1.0"
description = "3D occupancy fill: envelope encoder and catalog training"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "trimesh>=4.0",
    "tensorboard",
]

[project.optional-dependencies]
gradio = [
    "gradio>=4.44",
]
dev = [
    "gradio>=4.44",
    "open3d",
]

[project.scripts]
scatteringnet-train = "scatteringnet.train_multi_npz:main"
scatteringnet-viewer = "scatteringnet.viewer.serve:main"

# src/ is the scatteringnet package. src/gradio is a launch folder, not pip gradio.
[tool.setuptools]
package-dir = { "scatteringnet" = "src" }
packages = [
    "scatteringnet",
    "scatteringnet.geometry",
    "scatteringnet.scatter_generation",
    "scatteringnet.viewer",
]

[tool.setuptools.package-data]
scatteringnet = [
    "viewer/index.html",
    "viewer/css/*",
    "viewer/js/*",
    "viewer/vendor/**/*",
    "viewer/ui_prefs.example.json",
]
