# Experiment settings for the occupancy MLP MVP.
# `device` is still detected at runtime in src/config.py (CUDA vs CPU).

# --- Model Architecture ---
hidden: 64        # Number of hidden units (channels) per layer in the OccupancyMLP
depth: 4          # Number of hidden linear layers in the MLP network
seed: 1           # Random seed for reproducibility (PyTorch, NumPy, Python random)

# --- Path Configuration ---
data_dir: "E:/Work_stuff/scatteringNet/data"  # Base root directory where all NPZ dataset files are stored

# --- Training Hyperparameters ---
epochs: 30        # Total number of training epochs for the overfit run
lr: 0.001         # Initial learning rate for the Adam optimizer

# --- Validation Settings ---
val_fraction: 0.20  # Fraction of points held out randomly from the NPZ for validation (standard is 0.20 / 20%)

# --- File Paths ---
checkpoint_path: "models/one_npz.pt"               # Repo-relative path where the trained model checkpoint is saved/loaded
sample_npz: "exports/dataset_test/sphere__raycast_z_raut_s0.15_inout.npz"  # Path relative to data_dir for the sample NPZ used in training/inference

# --- Multi-NPZ catalog (Step 3; not used by train_one_npz.py) ---
# Glob is relative to data_dir. Explicit npz_paths (if non-empty) replaces the glob.
npz_glob: "exports/dataset/sphere_r0p5_sa16_sh16__occupancy_s0.15*.npz"
# npz_paths:
#   - exports/dataset/sphere_r0p5_sa16_sh16__occupancy_s0.15_inout.npz
max_files_per_shape: 2

# --- Run logs (Step 4; occupancy train is still Step 6) ---
# Suffix for runs/<YYYY-MM-DD_HH-MM-SS>_<name>/. Device is detected at runtime, not stored here.
run_name: run

# --- Checkpoints (Step 5; occupancy train is still Step 6) ---
# Scalar used to decide models/<run_id>/best.pt (strict improve). last.pt is always written.
# The run snapshot (runs/<id>/config.yaml) records:
#   total      — planned epoch count (copied from epochs)
#   checkpoint — epoch index of the last last.pt write (runtime; not a project knob)
checkpoint_metric: val_acc