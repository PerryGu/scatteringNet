# Conda env for this repo. Install with:
#   conda env create -f environment.yaml
# Recreate with:
#   conda env remove -n scatteringNet --yes
#   conda env create -f environment.yaml
#
# Install PyTorch from the pytorch/nvidia channels only.
# Do not add pip torch / torchvision / torchaudio — that overwrites
# conda DLLs on Windows and causes WinError 126.

name: scatteringNet
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - numpy=2.0.1
  - pyyaml=6.0.3
  - pip
  - pip:
    # Mesh IO + occupancy queries for Step 2 NPZ generation (not PyTorch).
    - open3d>=0.18
    - trimesh>=4.0
    # torch.utils.tensorboard.SummaryWriter (Step 4 run logs).
    - tensorboard>=2.14
